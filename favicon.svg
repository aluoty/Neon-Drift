<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="windGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shadow/ground -->
  <ellipse cx="256" cy="420" rx="180" ry="20" fill="#000" opacity="0.4"/>
  <!-- Rear wing -->
  <rect x="80" y="200" width="50" height="80" rx="6" fill="#ff00ff" filter="url(#glow)" opacity="0.8"/>
  <!-- Car body lower -->
  <path d="M100 300 L100 230 Q100 200 130 200 L380 200 Q420 200 430 240 L440 300 Z" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <!-- Car body upper (cockpit) -->
  <path d="M140 200 L160 150 Q170 130 200 130 L330 130 Q360 130 370 150 L390 200 Z" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <!-- Windscreen -->
  <path d="M170 195 L185 155 Q190 145 210 145 L280 145 L280 195 Z" fill="#aaffff" opacity="0.5"/>
  <!-- Side windows -->
  <path d="M290 195 L290 145 L350 145 Q360 145 365 160 L375 195 Z" fill="#aaffff" opacity="0.4"/>
  <!-- Headlights -->
  <rect x="430" y="235" width="14" height="12" rx="3" fill="#ffff00" filter="url(#glow)"/>
  <rect x="430" y="265" width="14" height="12" rx="3" fill="#ffff00" filter="url(#glow)"/>
  <!-- Tail lights -->
  <rect x="88" y="248" width="14" height="10" rx="2" fill="#ff0044" filter="url(#glow)"/>
  <rect x="88" y="270" width="14" height="10" rx="2" fill="#ff0044" filter="url(#glow)"/>
  <!-- Front wheel -->
  <circle cx="370" cy="310" r="35" fill="#111"/>
  <circle cx="370" cy="310" r="22" fill="#333"/>
  <circle cx="370" cy="310" r="8" fill="#00ffff" filter="url(#glow)"/>
  <!-- Rear wheel -->
  <circle cx="150" cy="310" r="35" fill="#111"/>
  <circle cx="150" cy="310" r="22" fill="#333"/>
  <circle cx="150" cy="310" r="8" fill="#ff00ff" filter="url(#glow)"/>
  <!-- Neon underglow -->
  <rect x="130" y="295" width="260" height="6" rx="3" fill="#00ffff" opacity="0.6" filter="url(#glow)"/>
  <!-- Speed lines -->
  <line x1="40" y1="230" x2="90" y2="230" stroke="#00ffff" stroke-width="2" opacity="0.5"/>
  <line x1="20" y1="260" x2="90" y2="260" stroke="#ff00ff" stroke-width="2" opacity="0.4"/>
  <line x1="30" y1="290" x2="90" y2="290" stroke="#00ffff" stroke-width="2" opacity="0.3"/>
</svg>
